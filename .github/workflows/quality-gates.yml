name: Quality Gates

on:
  pull_request:
    branches: [main, dev, staging]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install office dependencies
        run: cd office && npm ci

      - name: Build office
        run: cd office && npm run build

      - name: Read quality gate commands
        id: gates
        run: node office/dist/scripts/read-gates.js

      - name: Test
        if: steps.gates.outputs.test_cmd != ''
        run: ${{ steps.gates.outputs.test_cmd }}

      - name: Lint
        if: steps.gates.outputs.lint_cmd != ''
        run: ${{ steps.gates.outputs.lint_cmd }}

      - name: Type Check
        if: steps.gates.outputs.typecheck_cmd != ''
        run: ${{ steps.gates.outputs.typecheck_cmd }}

      - name: Format Check
        if: steps.gates.outputs.format_cmd != ''
        run: ${{ steps.gates.outputs.format_cmd }}
