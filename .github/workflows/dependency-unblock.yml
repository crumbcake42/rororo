name: Dependency Unblock

on:
  pull_request:
    types: [closed]

jobs:
  unblock:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unblock dependent issues
        uses: actions/github-script@v7
        with:
          script: |
            const mergedBranch = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Extract linked issue numbers from PR body (Closes #N, Fixes #N, Resolves #N)
            const closesPattern = /(?:closes|fixes|resolves)\s+#(\d+)/gi;
            const linkedIssues = [];
            let closesMatch;
            while ((closesMatch = closesPattern.exec(prBody)) !== null) {
              linkedIssues.push(parseInt(closesMatch[1], 10));
            }

            // Find issues labeled status:blocked-dependency
            const blockedIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'status:blocked-dependency',
              state: 'open',
            });

            for (const issue of blockedIssues.data) {
              const body = issue.body || '';
              // Check if this issue references the merged PR, branch, or a linked issue
              const referencesThis =
                body.includes(`#${prNumber}`) ||
                body.includes(mergedBranch) ||
                linkedIssues.some(n => body.includes(`#${n}`));

              if (referencesThis) {
                // Remove blocked-dependency label
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'status:blocked-dependency',
                  });
                } catch (e) {
                  // Label might not exist
                }

                // Add ready label
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['status:ready'],
                });

                // Comment on the issue
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Dependency resolved: PR #${prNumber} (branch \`${mergedBranch}\`) has been merged. This issue is now ready for work.`,
                });
              }
            }
